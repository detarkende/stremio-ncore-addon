name: CI
on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
jobs:
  build:
    name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Check formatting with Prettier
        run: pnpm run check-formatting
      - name: Lint with ESLint
        run: pnpm run lint
      - name: Run build
        run: pnpm run build
      - name: Run unit tests
        run: pnpm run test
      - name: Save HTML coverage report as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
      - name: 'Report coverage summary as comment'
        if: success()
        uses: davelosert/vitest-coverage-report-action@v2
